# PostgreSQL tuning for Immich on VM.Standard.A1.Flex (2 OCPU / 12 GB, aarch64).
#
# Mounted read-only into the database container at
# /etc/postgresql/conf.d/tuning.conf and pulled in via include_dir.
#
# The operation that determines whether this system feels fast or slow is
# pgvector similarity search backing CLIP semantic search. It is index-bound,
# not network-bound: from Pune to Oracle Mumbai the round trip is ~150 km, so
# no amount of network tuning matters if the vector index has to come off disk.
# Keeping that index resident in RAM is the whole game.

# --- Memory ---------------------------------------------------------------

# ~25% of system RAM, the standard starting point. Holds hot pages including
# the vector index.
shared_buffers = 3GB

# Not an allocation: it tells the planner how much memory the OS page cache is
# likely to have available. Set too low, the planner avoids index scans and
# falls back to sequential scans, which is exactly the wrong choice for vector
# similarity search.
effective_cache_size = 8GB

# Per sort/hash node, not per query - a query with several such nodes can use a
# multiple of this. 32MB is deliberately conservative given ML workers compete
# for the same 12 GB.
work_mem = 32MB

# Used by VACUUM, CREATE INDEX and ALTER TABLE ADD FOREIGN KEY. Higher values
# make index builds substantially faster, which matters when Immich rebuilds
# after a large import or a restore drill.
maintenance_work_mem = 512MB

# --- Write-ahead log ------------------------------------------------------

# Larger max_wal_size means fewer checkpoints. Immich's import path is
# write-heavy in bursts (a phone dumping a backlog of photos), and frequent
# checkpoints during those bursts cause visible stalls.
max_wal_size = 2GB
min_wal_size = 512MB

# Trades a little CPU for less WAL volume. On a 2-core box this is still worth
# it: the block volume is provisioned for throughput, not IOPS, so writing less
# is better than writing faster.
wal_compression = on

# Spread checkpoint I/O across most of the interval rather than spiking.
checkpoint_completion_target = 0.9

# --- Planner --------------------------------------------------------------

# Oracle block storage is network-attached SSD. The default random_page_cost of
# 4.0 assumes spinning rust and pushes the planner away from index scans; 1.1
# reflects that random reads cost nearly the same as sequential ones here.
random_page_cost = 1.1

# The block volume is Lower Cost (0 VPU), tuned for large sequential I/O, so
# readahead helps.
effective_io_concurrency = 200

# --- Parallelism ----------------------------------------------------------
# Only 2 OCPUs, and the ML container competes for them. Allowing many parallel
# workers would make Immich's UI stutter during a smart-search job.

max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# --- Connections ----------------------------------------------------------
# Immich uses a small pool. The default 100 wastes memory on a box this size.
max_connections = 50

# --- Autovacuum -----------------------------------------------------------
# Immich churns rows in the asset and job tables. Slightly more aggressive than
# default keeps bloat down without competing hard for the two cores.
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# --- Logging --------------------------------------------------------------
# Log slow queries only. Verbose logging burns block-volume write bandwidth for
# no benefit on a single-user system.
log_min_duration_statement = 2000
log_checkpoints = on
log_line_prefix = '%m [%p] %q%u@%d '
