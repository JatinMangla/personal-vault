# Immich stack for Oracle Cloud Always Free (VM.Standard.A1.Flex, 2 OCPU / 12 GB, aarch64).
#
# Immich is DEPLOYED here, never rebuilt. It already implements CLIP semantic
# search, InsightFace face recognition, mobile auto-backup, albums and sharing.
#
# EVERY TAG IS PINNED. Immich ships breaking changes between releases, including
# database migrations that are not reversible. `:latest` plus an unattended pull
# is how a photo library gets corrupted. Do NOT add Watchtower or any other
# auto-updater. Upgrades are a deliberate act: read the release notes, take a
# backup, then bump IMMICH_VERSION in .env and re-run.
#
# No ports are published to the host's public interface. Access is over
# Tailscale only; see the `ports` binding below, which is deliberately
# restricted to the Tailscale interface address.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # Bound to the Tailscale interface address, never 0.0.0.0.
      # TAILSCALE_IP is set by the Ansible role from `tailscale ip -4`.
      - '${TAILSCALE_IP}:2283:2283'
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: always
    healthcheck:
      disable: false
    # Hardening: no new privileges, and a read-only root filesystem is not
    # possible here because Immich writes to /data, but the container does not
    # need to escalate.
    security_opt:
      - no-new-privileges:true

  immich-machine-learning:
    container_name: immich_machine_learning
    # The ML image carries the CLIP and face-recognition models. The plain tag
    # (no -cuda/-openvino suffix) is the CPU build, which is correct for ARM.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    security_opt:
      - no-new-privileges:true
    # ML inference on 2 ARM cores is the one workload that can starve the rest
    # of the box. Cap it so a large smart-search job cannot make the server
    # unresponsive; jobs simply take longer instead.
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 4G

  redis:
    container_name: immich_redis
    # Valkey is the maintained open-source fork of Redis; Immich ships it as the
    # default queue backend. Digest-pinned as well as tagged.
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    security_opt:
      - no-new-privileges:true

  database:
    container_name: immich_postgres
    # pgvector build maintained by the Immich project. The database is the part
    # that cannot be regenerated from the filesystem, so it is both pinned and
    # backed up nightly (see ops/backup/immich-backup.sh).
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Selects which of the image's bundled config templates is used
      # (postgresql.hdd.conf vs postgresql.ssd.conf). Those templates are what
      # set `shared_preload_libraries = vchord.so, vectors.so` - without this
      # the extensions never load and immich_server crash-loops with
      # "vchord must be loaded via shared_preload_libraries".
      # HDD is correct here: the block volume is 0 VPU, tuned for sequential I/O.
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 256mb
    restart: always
    security_opt:
      - no-new-privileges:true
    # Use the image's own healthcheck. Immich's Postgres image ships one that
    # understands its vector extensions; overriding it with a bare pg_isready
    # tests less, not more.
    healthcheck:
      disable: false
    # NO `command:` OVERRIDE - deliberately.
    #
    # Two earlier attempts both broke this container:
    #   1. `-c config_file=/etc/postgresql/postgresql.conf` - a Debian path that
    #      does not exist in this image, so Postgres exited immediately.
    #   2. Tuning passed as `-c` flags - this replaced the image's own startup
    #      configuration, dropping `shared_preload_libraries = vchord.so`.
    #      Postgres then started fine but immich_server crash-looped with
    #      "vchord must be loaded via shared_preload_libraries".
    #
    # The image selects a bundled config template based on DB_STORAGE_TYPE and
    # that template carries the preload settings Immich's vector search needs.
    # Immich's own compose file overrides nothing here, and neither do we.
    #
    # Postgres tuning is applied instead by roles/immich, which appends to the
    # live postgresql.auto.conf via ALTER SYSTEM - the supported way to change
    # settings without replacing the server's startup configuration.
    # See infra/postgres/tuning.conf for the reasoning behind each value.

volumes:
  model-cache:
