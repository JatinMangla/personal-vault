# Copy to inventory.ini (gitignored) and fill in.
#
# First run, before Tailscale is up, uses the public IP that Oracle assigned.
# Every run after that should use the Tailscale address or MagicDNS name, so
# the public IP can stop being reachable at all.

[immich]
immich-mumbai ansible_host=100.x.y.z ansible_user=ubuntu

[immich:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/oracle_immich_ed25519
