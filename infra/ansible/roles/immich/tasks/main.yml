---
# Deploys Immich. Does not build it, does not extend it.
#
# Volume layout, which is load-bearing for the budget:
#   boot 50 GB  (Balanced)   -> OS, Docker, Postgres data
#   block 150 GB (Lower Cost, 0 VPU) -> UPLOAD_LOCATION, all media
#
# Never raise the block volume's VPU tier. VPUs bill separately from capacity at
# roughly $0.0017 per VPU per GB-month; moving 150 GB to Balanced costs about
# $3/month and blows the $1/year ceiling on its own.

# --- Block volume ---------------------------------------------------------

- name: Look for the Oracle-managed device symlink
  ansible.builtin.stat:
    path: "{{ block_device_preferred }}"
  register: block_dev_preferred

- name: Look for the raw device
  ansible.builtin.stat:
    path: "{{ block_device_fallback }}"
  register: block_dev_fallback

- name: Fail with guidance if the block volume is missing
  ansible.builtin.fail:
    msg: >-
      Neither {{ block_device_preferred }} nor {{ block_device_fallback }} was
      found. Attach the 150 GB block volume in the OCI console
      (Lower Cost / 0 VPU), then run the iSCSI attach commands the console
      provides. See infra/docs/volume-layout.md.
  when:
    - not block_dev_preferred.stat.exists
    - not block_dev_fallback.stat.exists

- name: Select the device path to use
  # Prefer the Oracle symlink when it exists: it is stable across reboots,
  # whereas /dev/sdX ordering is not guaranteed. The filesystem is mounted by
  # LABEL regardless, so this only affects formatting.
  ansible.builtin.set_fact:
    block_device: >-
      {{ block_device_preferred if block_dev_preferred.stat.exists
         else block_device_fallback }}

- name: Report the device in use
  ansible.builtin.debug:
    msg: "Using block device {{ block_device }}"

- name: Read the filesystem on the block device
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ block_device }}"
  register: blkid_result
  changed_when: false
  failed_when: false

- name: Create an ext4 filesystem if the volume is blank
  # Guarded on blkid returning nothing, so this can never reformat a volume
  # that already holds media.
  community.general.filesystem:
    fstype: ext4
    dev: "{{ block_device }}"
    opts: -m 1 -L immich-media
  when: blkid_result.stdout | trim == ''

- name: Mount the media volume
  ansible.posix.mount:
    path: "{{ media_mount }}"
    src: "LABEL=immich-media"
    fstype: ext4
    # noatime: every read would otherwise write back an access time, which is
    # pure waste on a media library and costs block-volume write bandwidth.
    # nofail: a missing volume must not stop the host from booting, or a bad
    # attach leaves the box unreachable.
    # _netdev: this is an iSCSI volume, so systemd must wait for the network
    # before mounting. Oracle's console warns that omitting it makes reboots
    # fail. Required, not optional, for a network-attached device.
    opts: defaults,noatime,nofail,_netdev
    state: mounted

- name: Create the Immich media subdirectories
  ansible.builtin.file:
    path: "{{ media_mount }}/{{ item }}"
    state: directory
    owner: "{{ immich_user }}"
    group: "{{ immich_user }}"
    mode: '0750'
  loop:
    - upload          # originals from mobile and browser
    - library         # originals under the storage template engine
    - thumbs          # derived, excluded from backup
    - encoded-video   # derived, excluded from backup
    - profile         # avatars
    - backups         # Immich's own database dumps - backed up, never excluded

- name: Create the Postgres data directory on the boot volume
  # Deliberately NOT on the block volume: Postgres wants low-latency random
  # I/O, and the block volume is provisioned for large sequential reads.
  #
  # OWNERSHIP MATTERS. This is bind-mounted into the container, and the postgres
  # user inside that image is UID/GID 999. Creating it root:root 0700 - as an
  # earlier version did - left the server unable to read its own files:
  #
  #   FATAL: could not open file "global/pg_filenode.map": Permission denied
  #
  # 0700 is still correct for the mode; only the owner was wrong.
  ansible.builtin.file:
    path: "{{ db_data_location }}"
    state: directory
    owner: '999'
    group: '999'
    mode: '0700'

# --- Compose project ------------------------------------------------------

- name: Create the Immich project directory
  ansible.builtin.file:
    path: "{{ immich_dir }}"
    state: directory
    owner: "{{ immich_user }}"
    group: "{{ immich_user }}"
    mode: '0750'

- name: Install docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ immich_dir }}/docker-compose.yml"
    owner: "{{ immich_user }}"
    group: "{{ immich_user }}"
    mode: '0640'
  notify: Restart immich

# The tuning values are passed as `-c` flags in docker-compose.yml rather than
# mounted as a file: the file approach needed `-c config_file=` pointing at a
# Debian path that does not exist in Immich's Postgres image, which stopped the
# container from starting at all. postgres/tuning.conf is kept as the reference
# for why each value was chosen.

- name: Render the environment file
  # 0600: contains DB_PASSWORD. Never world-readable, never committed.
  ansible.builtin.template:
    src: immich.env.j2
    dest: "{{ immich_dir }}/.env"
    owner: "{{ immich_user }}"
    group: "{{ immich_user }}"
    mode: '0600'
  no_log: true
  notify: Restart immich

- name: Validate the compose file
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ immich_dir }}"
  changed_when: false

- name: Pull the pinned images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ immich_dir }}"
  register: compose_pull
  changed_when: "'Downloaded newer image' in compose_pull.stderr or 'Pull complete' in compose_pull.stderr"

- name: Start the Immich stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ immich_dir }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"
  failed_when: false

- name: Show container logs if the stack did not start
  # "container X is unhealthy" says nothing about WHY. Without this you have to
  # know to run `docker logs` yourself; the answer is almost always in there.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for c in immich_postgres immich_redis immich_server immich_machine_learning; do
        echo "===== $c ====="
        docker logs --tail 25 "$c" 2>&1 || echo "(container not created)"
      done
    executable: /bin/bash
  register: container_logs
  changed_when: false
  when: compose_up.rc != 0

- name: Fail with the container logs attached
  ansible.builtin.fail:
    msg: |
      The Immich stack did not start.

      {{ compose_up.stderr }}

      {{ container_logs.stdout | default('no logs captured') }}
  when: compose_up.rc != 0

- name: Wait for Postgres to accept connections
  ansible.builtin.command:
    cmd: >-
      docker exec immich_postgres
      pg_isready -U {{ immich_db_username | default('postgres') }}
      -d {{ immich_db_name | default('immich') }}
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Apply Postgres tuning via ALTER SYSTEM
  # ALTER SYSTEM writes postgresql.auto.conf, which Postgres reads AFTER its
  # main config. That leaves the image's own startup settings intact - notably
  # shared_preload_libraries, which loads the vchord extension Immich's search
  # depends on.
  #
  # Overriding `command:` to pass these as -c flags instead does apply the
  # tuning, but silently drops shared_preload_libraries and leaves
  # immich_server crash-looping. Learned the hard way.
  ansible.builtin.command:
    cmd: >-
      docker exec immich_postgres
      psql -U {{ immich_db_username | default('postgres') }}
      -d {{ immich_db_name | default('immich') }}
      -c "ALTER SYSTEM SET {{ item.key }} = '{{ item.value }}';"
  loop:
    # Sized for 12 GB RAM. See infra/postgres/tuning.conf for the reasoning.
    - { key: shared_buffers, value: 3GB }
    - { key: effective_cache_size, value: 8GB }
    - { key: work_mem, value: 32MB }
    - { key: maintenance_work_mem, value: 512MB }
    - { key: max_wal_size, value: 2GB }
    - { key: min_wal_size, value: 512MB }
    - { key: wal_compression, value: 'on' }
    - { key: checkpoint_completion_target, value: '0.9' }
    # Network-attached SSD: the default random_page_cost of 4.0 assumes spinning
    # disks and pushes the planner away from the index scans pgvector needs.
    - { key: random_page_cost, value: '1.1' }
    - { key: effective_io_concurrency, value: '200' }
    # Only 2 OCPUs, shared with the ML container.
    - { key: max_worker_processes, value: '4' }
    - { key: max_parallel_workers, value: '2' }
    - { key: max_parallel_workers_per_gather, value: '1' }
    - { key: max_parallel_maintenance_workers, value: '1' }
    - { key: max_connections, value: '50' }
    - { key: autovacuum_max_workers, value: '2' }
    - { key: autovacuum_naptime, value: 30s }
    - { key: log_min_duration_statement, value: '2000' }
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  changed_when: true
  register: alter_system
  failed_when: false
  notify: Restart immich

- name: Show Postgres logs if the tuning could not be applied
  # Without this the failure is the same connection error repeated once per
  # setting - 19 identical walls of text and no cause. The reason is in the
  # container log.
  ansible.builtin.command:
    cmd: docker logs --tail 30 immich_postgres
  register: pg_logs
  changed_when: false
  when: alter_system is failed or (alter_system.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length) > 0

- name: Fail with the Postgres logs attached
  ansible.builtin.fail:
    msg: |
      Could not apply Postgres tuning.

      {{ pg_logs.stdout | default('') }}
      {{ pg_logs.stderr | default('') }}
  when: (alter_system.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length) > 0

- name: Reload Postgres so the tuning takes effect
  # Most of these are reload-safe; shared_buffers and max_connections need a
  # restart, which the handler above performs at the end of the play.
  ansible.builtin.command:
    cmd: >-
      docker exec immich_postgres
      psql -U {{ immich_db_username | default('postgres') }}
      -d {{ immich_db_name | default('immich') }}
      -c "SELECT pg_reload_conf();"
  changed_when: true

- name: Wait for the Immich API to answer
  ansible.builtin.uri:
    url: "http://{{ tailscale_ip }}:2283/api/server/ping"
    status_code: 200
  register: immich_ping
  # 60 x 10s = 10 minutes. A first boot runs database migrations and builds the
  # vector indexes, which is slow on 2 ARM cores; 5 minutes was not enough.
  retries: 60
  delay: 10
  until: immich_ping.status == 200
  failed_when: false

- name: Show immich_server logs if the API never answered
  ansible.builtin.command:
    cmd: docker logs --tail 40 immich_server
  register: server_logs
  changed_when: false
  when: immich_ping.status != 200

- name: Fail with the server logs attached
  ansible.builtin.fail:
    msg: |
      Immich started but its API never answered on port 2283.

      {{ server_logs.stdout | default('no logs captured') }}
      {{ server_logs.stderr | default('') }}
  when: immich_ping.status != 200

- name: Report the access URL
  ansible.builtin.debug:
    msg: >-
      Immich is up at http://{{ tailscale_ip }}:2283 - reachable only from the
      tailnet. Next: create the admin account, then set video transcoding to
      "not browser-compatible only" and disable HEIC-to-JPEG conversion.
      See infra/docs/immich-settings.md.
