[defaults]
inventory = inventory.ini
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

# Readable task output. The old way to get this was `stdout_callback = yaml`
# from community.general, but that plugin was REMOVED in community.general 12.0
# and errors out on Ubuntu 24.04's Ansible 2.16. This is the built-in
# replacement, available since ansible-core 2.13.
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
