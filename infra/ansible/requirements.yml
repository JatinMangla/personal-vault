---
# Install with: ansible-galaxy collection install -r requirements.yml
#
# Version ceilings matter here. Ubuntu 24.04 ships ansible-core 2.16, and
# community.general 12.x requires a newer core - installing it unpinned
# produces "Collection community.general does not support Ansible version
# 2.16.3" and removed-plugin errors at run time.
collections:
  - name: community.general
    version: ">=9.0.0,<11.0.0"
  - name: ansible.posix
    version: ">=1.5.0,<2.0.0"
