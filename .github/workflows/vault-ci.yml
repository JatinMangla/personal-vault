name: vault-ci

# Lint, typecheck and test the vault on every push and PR touching it.
#
# The crypto suite is the gate that matters: it is what stands between a code
# change and a silent data-loss bug in an archive with no plaintext copy.

on:
  push:
    branches: [main]
    paths:
      - 'vault/**'
      - '.github/workflows/vault-ci.yml'
  pull_request:
    paths:
      - 'vault/**'
      - '.github/workflows/vault-ci.yml'

# Cancel superseded runs on the same branch; only the latest matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: vault

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vault/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Crypto test suite (blocking)
        # Round-trip, chunk boundaries, IV uniqueness, tamper detection and
        # wrong-passphrase behaviour. A failure here is a data-loss event in
        # waiting, not a flaky test.
        run: npm test

      - name: Build
        env:
          # Placeholders: the build must not require real credentials, and CI
          # must never hold them. Anything that genuinely needs a secret belongs
          # at runtime, not at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - name: Scan the client bundle for leaked credentials
        # Catches a server-only module being pulled into the browser bundle,
        # which is the failure mode that would expose R2 keys or the Supabase
        # service-role key.
        run: npm run check:bundle

  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vault/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # WebKit matters here: nearly every rule the audit enforces exists
        # because of an iOS Safari behaviour that Chromium will not reproduce.
        run: npx playwright install --with-deps chromium webkit

      - name: Responsive audit (blocking)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vault/playwright-report/
          retention-days: 7
