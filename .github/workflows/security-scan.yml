name: security-scan

# Weekly secret and dependency scan, plus on every push.
#
# gitleaks runs over the FULL HISTORY, not just the working tree. A secret that
# was committed and then removed is still in the history and still compromised;
# only a scan with history depth will find it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 04:00 UTC (09:30 IST).
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. Depth 1 would miss a secret in an earlier commit,
          # which is exactly the case that matters.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Secret-blocking hook regression suite
        # A silently broken hook is the same as no hook, so its own tests run
        # in CI rather than being trusted to have been run by hand.
        run: bash .claude/hooks/__tests__/test-block-secrets.sh

      - name: Check .gitignore covers the sensitive patterns
        run: |
          set -euo pipefail
          missing=0
          for pattern in '.env' '*.pem' '*.key' 'secrets/' '*.tfvars'; do
            if ! grep -qF -- "$pattern" .gitignore; then
              echo "MISSING from .gitignore: $pattern"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo ".gitignore covers all required patterns"
          exit "$missing"

      - name: Assert no NEXT_PUBLIC_ variable holds a secret
        run: |
          set -euo pipefail
          # NEXT_PUBLIC_ variables are inlined into the browser bundle. A
          # secret-sounding name with that prefix is a leak by construction.
          if grep -rnE 'NEXT_PUBLIC_[A-Z_]*(SECRET|PRIVATE|SERVICE_ROLE|ACCESS_KEY)' \
               --include='*.ts' --include='*.tsx' --include='*.json' \
               --include='*.example' vault/ 2>/dev/null; then
            echo "BLOCKER: a NEXT_PUBLIC_ variable appears to hold a secret"
            exit 1
          fi
          echo "No secret-shaped NEXT_PUBLIC_ variables found"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vault/package-lock.json

      - name: npm audit
        working-directory: vault
        # High and critical fail the build. Moderate findings are reported and
        # triaged in vault/SECURITY-NOTES.md with their reachability, rather
        # than being silenced or ignored.
        run: |
          npm ci
          npm audit --audit-level=high

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: shellcheck
        # These scripts run unattended on a remote box; a bug surfaces as a
        # silently failing timer, which is the failure mode backups are most
        # vulnerable to.
        #
        # ops/insta360-bin was NOT scanned until 2026-09-16 - the archive
        # pipeline, which deletes footage after verifying it, was the only ops
        # directory with no static analysis at all. Every one of them now
        # parses clean.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning \
            ops/backup/*.sh \
            ops/metrics/*.sh \
            ops/insta360-bin/*.sh \
            .claude/hooks/*.sh

      - name: Shell scripts parse under bash
        # shellcheck is a linter, not a parser: it reports style and common
        # mistakes but does not prove the file is valid shell. `bash -n` does.
        # This project has repeatedly lost `||` operators to terminal paste
        # corruption, which produces VALID shell with the wrong meaning - so
        # this catches the parse failures and the grep below catches the rest.
        run: |
          set -euo pipefail
          for f in ops/backup/*.sh ops/metrics/*.sh ops/insta360-bin/*.sh .claude/hooks/*.sh; do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; exit 1; }
          done
          echo "all shell scripts parse"

      - name: No silently eaten shell operators
        # `[[ -d "$X" ]]  { ... }` and `cmd >/dev/null  true` are valid shell
        # with the wrong meaning - bash -n cannot catch them. Four separate
        # instances reached this repo by being dictated through a phone
        # terminal that swallowed the `||`.
        run: |
          set -euo pipefail
          if grep -rnE ']] +[{]|null +[{]|>/dev/null +[a-z]' \
               ops/backup/*.sh ops/metrics/*.sh ops/insta360-bin/*.sh .claude/hooks/*.sh; then
            echo "BLOCKER: a shell operator looks to have been eaten - see docs/HARD-WON.md"
            exit 1
          fi
          echo "no eaten operators found"

      - name: Batch-splitting fixtures
        # The fitting loop decides how much goes into one batch. Too much fills
        # the media volume mid-Check-#2; too little stalls the drain. Both
        # failures are silent, so the arithmetic is pinned by fixtures.
        run: bash ops/insta360-bin/test-batch-split.sh

      - name: Ledger hash-reuse fixtures
        # ledger_hash() reuses the hash Check #1 computed instead of reading
        # every file again. The ledger is what tg-prune.sh checks before
        # deleting originals from the card, so a wrong hash there is the one
        # mistake with no recovery. These pin that every malformed, missing or
        # absent entry falls back to hashing rather than recording anything
        # else - the speed change must be indistinguishable from the slow path.
        run: bash ops/insta360-bin/test-ledger-hash.sh

      - name: Prune --trust-size fixtures
        # --trust-size deletes originals from the card on a name+size match,
        # without reading the file. It is a deliberately weaker check than the
        # default SHA-256, so the boundary of what it will and will not act on
        # is pinned: a size mismatch must be KEPT, and a legacy ledger row with
        # no size column must fall back to hashing rather than trusting a bare
        # filename - the exact mistake tg-prune.sh exists to prevent.
        run: bash ops/insta360-bin/test-prune-trust-size.sh

      - name: Idle-wait fixtures
        # idle_wait() ends a drain's trailing wait early when Syncthing reports
        # nothing left to deliver. Waiting too long costs minutes; stopping too
        # early ends a drain with files still on the card, which looks identical
        # to a healthy finish from inside the loop. These pin that ONLY a
        # positive "needBytes 0 / state idle" shortens the wait, and that
        # unreachable, mid-transfer and unparsable all wait the full window.
        run: bash ops/insta360-bin/test-idle-wait.sh

      - name: Check #2 fallback-guard fixtures
        # full_channel_fits() refuses a whole-channel download that cannot
        # finish on the volume. On 2026-09-24 the unguarded fallback started
        # pulling a 162 GB channel onto 111 GB free after one Telegram timeout.
        run: bash ops/insta360-bin/test-channel-fallback.sh

      - name: Parts-uploader fixtures
        # tg-upload-parts.sh writes a ledger row, and the ledger is what lets
        # tg-prune delete an original from the card. These pin that a row is
        # written only when every part round-trips, that a failed part is
        # redone alone, and that a mismatched file uploads nothing.
        run: bash ops/insta360-bin/test-upload-parts.sh

      - name: Delete-guard fixtures
        # tg-delete-ids.py must never delete a message the ledger points at.
        run: python3 ops/insta360-bin/test-delete-ids.py

      - name: Python scripts compile
        # Several ops scripts (the probes) have no fixtures and are authored on a
        # machine without Python. Byte-compiling catches a syntax error here
        # rather than on the VM, mid-drain.
        run: python3 -m py_compile ops/insta360-bin/*.py

      - name: Metrics payload JSON-safety fixtures
        # The metrics payload is a heredoc: one unescaped quote or a non-number
        # makes the body invalid, ingest answers 400, and every figure on
        # /status goes stale at once. These pin the escaping, and that every
        # interpolated field is in the sanitised lists.
        run: bash ops/metrics/test-payload-json.sh

      - name: Parallel fetcher fixtures
        # tg-fetch-par.py runs INSIDE the integrity chain, between the upload
        # and the SHA-256 that gates deleting originals. These pin the three
        # load-bearing properties: a short download must fail rather than reach
        # the rejoin, an in-flight temp file must stay OUTSIDE the
        # NAME.[0-9][0-9]* rejoin glob (a naive NAME.part matched it, which
        # these fixtures caught before it ever ran), and concurrency stays
        # bounded at 8.
        run: python3 ops/insta360-bin/test-fetch-par.py

      - name: Message-id resolver fixtures
        # tg-resolve-ids.py decides which Telegram message Check #2 fetches
        # back. A WRONG id fetches the wrong bytes, and the channel contains
        # duplicate filenames from interrupted drains, so newest-wins and the
        # split-part grouping are the two rules that must not regress.
        run: python3 ops/insta360-bin/test-resolve-ids.py
